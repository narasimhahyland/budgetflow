version: 2

# npm updates need the private registry. Add SATORI_PACKAGES_TOKEN as a *Dependabot* secret
# (Settings > Secrets and variables > Dependabot) or the npm job will report authentication errors.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.SATORI_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Satori packages are pinned alpha releases; upgrade them deliberately.
      - dependency-name: '@hylandsoftware/*'
      # Angular, Material and Nx move together through `nx migrate`, not Dependabot.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
      testing:
        patterns: ['@playwright/test', 'playwright', 'testcontainers', '@testcontainers/*', 'autocannon']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'stylelint', 'stylelint-*', 'prettier', 'eslint-*']
